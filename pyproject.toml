[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "note2latex-agent"
version = "0.1.0"
description = "API-powered math note transcription with bounded review agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "Pillow>=11,<13",
  "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
note2latex = "note2latex.cli:main"

[tool.setuptools.packages.find]
include = ["note2latex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

